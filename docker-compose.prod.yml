version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: borrowbuy-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-borrowbuy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BorrowBuySecureDB2026!}
      POSTGRES_DB: ${POSTGRES_DB:-borrowbuy_production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borrowbuy_user} -d ${POSTGRES_DB:-borrowbuy_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - borrowbuy_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: borrowbuy-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-borrowbuy_user}:${POSTGRES_PASSWORD:-BorrowBuySecureDB2026!}@postgres:5432/${POSTGRES_DB:-borrowbuy_production}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production-aws-jwt-secret-borrowbuy-2026-secure}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      NOTIFICATION_DRIVER: ${NOTIFICATION_DRIVER:-local}
      PAYMENT_DRIVER: ${PAYMENT_DRIVER:-simulation}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
    networks:
      - borrowbuy_net

  nginx:
    image: nginx:alpine
    container_name: borrowbuy-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - borrowbuy_net

networks:
  borrowbuy_net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
